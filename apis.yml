name: Blockspring
description: >-
  Blockspring was a data integration and enrichment platform that let developers
  and spreadsheet users run cloud functions and connect to hundreds of third-party
  APIs and data services from Google Sheets, Excel, and via its own API. Founded
  around 2014 and originally Y Combinator backed, it was acquired by Coda (Krypton)
  in 2017 and surfaced here as an a16z portfolio-associated company. All Blockspring
  services -- the website tooling, integrations, plugins, APIs, and data enrichment
  -- were permanently shut down on December 29, 2022, with active subscriptions
  cancelled and prorated refunds issued. This profile is retained as a historical
  record; there is no live developer surface, OpenAPI, SDK, or documentation to
  enrich.
